<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NaijaPocket — More Value. Less Spending. Better Living.</title>
  <meta name="description" content="NaijaPocket is a free Nigerian app for budgets, opportunities, small-business records, scam awareness and everyday health notes. Your data stays on your phone.">
  <meta name="theme-color" content="#062419">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://ayodeb65.github.io/naijapocket/app/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="boot" id="boot">
    <img src="../assets/logo-mark.svg" alt="">
    <p>Opening your pocket…</p>
  </div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="NaijaPocket"></nav>
  </div>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <p style="padding:24px;color:#fff">NaijaPocket needs JavaScript. It still keeps your notes on this phone — nothing is sent to a server.</p>
  </noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
